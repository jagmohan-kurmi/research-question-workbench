[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-question-workbench"
version = "0.1.0"
description = "Build structured PICO, SPIDER, and FINER worksheets."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Academic Research Tools contributors"}]

[project.scripts]
research-question-workbench = "research_question_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
